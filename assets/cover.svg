      <stop offset="1" stop-color="#B8E780" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7D9890" opacity=".2"/>
    </pattern>
    <clipPath id="round">
      <rect width="1280" height="470" rx="24"/>
    </clipPath>
  </defs>
