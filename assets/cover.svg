<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="title description">
  <title id="title">local-docs-ai</title>
  <desc id="description">Локальный ИИ для вопросов к своим документам. Справа — листы с выделенным фрагментом и пример ответа с источником.</desc>
  <defs>
